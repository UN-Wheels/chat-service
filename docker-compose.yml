services:
  # ──────────────────────────────────────────────
  #  MongoDB
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: uniwheels-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ──────────────────────────────────────────────
  #  Chat Service
  # ──────────────────────────────────────────────
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniwheels-chat-service
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/uniwheels_chat
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
